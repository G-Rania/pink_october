[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"
[build.environment]
  NODE_VERSION = "22"
  # These values are read only at runtime by Netlify Functions. Netlify's
  # environment-value scanner otherwise treats their legitimate function use
  # as a build leak. npm run build separately scans dist for the raw,
  # URI-encoded, and base64-encoded values before a deploy can succeed.
  SECRETS_SCAN_OMIT_KEYS = "SUPABASE_SERVICE_ROLE_KEY,SUPABASE_URL,MESSAGE_MODERATION_MODE"
[functions]
  node_bundler = "esbuild"
[dev]
  command = "npm run dev"
  targetPort = 5173
  port = 8888
  autoLaunch = false
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"
[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
